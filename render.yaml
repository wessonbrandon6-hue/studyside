services:
  - type: web
    name: studyside-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: studyside-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /app/backend/data
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://wessonbrandon6-hue.github.io
